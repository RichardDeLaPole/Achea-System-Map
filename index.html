<title>Einos System Map</title>

  :root {
    --bg:#03050f; --panel:#060b1a; --border:#1a2a4a;
    --accent:#4af0d8; --text:#c8daf5; --text-dim:#5a7a9a; --text-bright:#e8f4ff;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Exo 2',sans-serif;font-weight:200;overflow:hidden;height:100vh;width:100vw;display:flex;flex-direction:column;}
  header{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:9px 20px;background:#060a18;border-bottom:1px solid var(--border);z-index:10;gap:12px;flex-wrap:wrap;}
  .title-group h1{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:1.3rem;letter-spacing:.18em;color:var(--accent);text-transform:uppercase;}
  .title-group p{font-family:'Share Tech Mono',monospace;font-size:.6rem;color:var(--text-dim);letter-spacing:.12em;}
  .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .hint{font-family:'Share Tech Mono',monospace;font-size:.65rem;color:var(--text-dim);display:flex;align-items:center;gap:4px;}
  .key{background:#0d1628;border:1px solid var(--border);padding:1px 5px;border-radius:3px;color:var(--accent);}
  .btn{background:#0d1628;border:1px solid var(--border);color:var(--accent);height:26px;padding:0 10px;cursor:pointer;border-radius:3px;font-family:'Share Tech Mono',monospace;font-size:.65rem;letter-spacing:.05em;display:flex;align-items:center;gap:5px;transition:background .15s,border-color .15s;white-space:nowrap;}
  .btn:hover{background:#162040;border-color:var(--accent);}
  .btn.ico{width:26px;padding:0;justify-content:center;font-size:1rem;}
  .layout{flex:1;display:flex;overflow:hidden;min-height:0;}
  canvas{flex:1;display:block;cursor:grab;min-width:0;}
  canvas.dragging{cursor:grabbing;}
  #panel{width:320px;flex-shrink:0;background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
  .ph{padding:14px 18px 11px;border-bottom:1px solid var(--border);flex-shrink:0;}
  .pname{font-family:'Rajdhani',sans-serif;font-size:1.4rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;}
  .palt{font-family:'Share Tech Mono',monospace;font-size:.65rem;color:var(--text-dim);margin-top:2px;letter-spacing:.08em;}
  .ptype{font-size:.72rem;color:var(--text-dim);margin-top:5px;font-weight:300;line-height:1.4;}
  .pbody{flex:1;overflow-y:auto;padding:0 18px 16px;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
  .pbody::-webkit-scrollbar{width:4px;}
  .pbody::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
  .stitle{font-family:'Share Tech Mono',monospace;font-size:.58rem;letter-spacing:.18em;color:var(--accent);text-transform:uppercase;margin:14px 0 7px;padding-bottom:4px;border-bottom:1px solid #0d1a30;}
  .drow{display:flex;justify-content:space-between;align-items:baseline;padding:3px 0;border-bottom:1px solid #09111f;gap:8px;}
  .dlabel{font-size:.68rem;color:var(--text-dim);flex-shrink:0;max-width:48%;}
  .dval{font-family:'Share Tech Mono',monospace;font-size:.68rem;color:var(--text-bright);text-align:right;word-break:break-word;}
  .dnote{font-size:.6rem;color:#3a5a7a;font-style:italic;padding:2px 0 1px;line-height:1.4;}
  .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;color:var(--text-dim);font-family:'Share Tech Mono',monospace;font-size:.7rem;text-align:center;gap:10px;padding:20px;}
  .emico{font-size:2rem;opacity:.25;}
  .legend{flex-shrink:0;padding:8px 18px;border-top:1px solid var(--border);display:flex;flex-wrap:wrap;gap:8px;}
  .leg{display:flex;align-items:center;gap:5px;font-size:.6rem;color:var(--text-dim);font-family:'Share Tech Mono',monospace;}
  .ldot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  #tt{position:fixed;background:rgba(6,10,24,.93);border:1px solid var(--border);border-radius:4px;padding:5px 10px;font-family:'Share Tech Mono',monospace;font-size:.68rem;color:var(--accent);pointer-events:none;display:none;z-index:200;letter-spacing:.05em;}
</style>
</head>

</div>

        'Orbital Period':'678.4 yr (247,700 days)','Inclination':'1.5°','Direction':'Prograde'},
      'ATMOSPHERE':{'H₂':'75%','He':'18%','CH₄':'~5% (deep blue — primary colourant)',
        'H₂O':'~1% (deep ice layer)','NH₃':'Trace (frozen out)'},
      'APPEARANCE':{'Colour':'Deep blue','Mechanism':'CH₄ absorbs red/orange light',
        'vs Neptune':'Darker — CH₄ 5% vs Neptune\'s 2%',
        'Ice Mantle':'H₂O + NH₃ + CH₄ ices','Analogue':'Neptune (deeper blue)'}}
  },
];

// ════════════════════════════════════════════════
// COORDINATE SYSTEM — pure linear AU
// ════════════════════════════════════════════════
// World space: star at origin, 1 AU = AU_PX pixels. Fully linear, no compression.
// Planet position: periapsis on +x axis → x = sma*(1-ecc)*AU_PX, y = 0
// Orbit ellipse: a = sma*AU_PX, b = a*sqrt(1-e²), centre at x = -a*e (so star is at right focus)
// Moon position: offset from Achea's position in km converted to px
// Camera: pan = (camX, camY) in world px, zoom = camScale.
// Screen = world * camScale + (W/2 + camX*camScale, H/2 + camY*camScale)

const AU_KM = 149.6e6;
const AU_PX  = 100;   // 1 AU = 100 world px at camScale=1

function auPx(au) { return au * AU_PX; }
function kmPx(km) { return km / AU_KM * AU_PX; }

// World ↔ screen
function w2s(wx, wy) {
  return [W/2 + (wx + camX)*camScale,
          H/2 + (wy + camY)*camScale];
}
function s2w(sx, sy) {
  return [(sx - W/2)/camScale - camX,
          (sy - H/2)/camScale - camY];
}

// ── CANVAS & CAMERA ────────────────────────────
const canvas = document.getElementById('map');
const ctx    = canvas.getContext('2d');
let W=0, H=0;
let camX=0, camY=0, camScale=1;
let dragging=false, didDrag=false;
let dragStart=null, camStart=null;
let selectedId=null, hoveredId=null;

let stars=[];
function initStars(){
  stars=[];
  for(let i=0;i<400;i++)
    stars.push({x:Math.random(),y:Math.random(),r:Math.random()*1.1,a:.15+Math.random()*.75});
}

function resize(){
  const dpr=window.devicePixelRatio||1;
  const rect=canvas.getBoundingClientRect();
  W=rect.width; H=rect.height;
  canvas.width=W*dpr; canvas.height=H*dpr;
  ctx.scale(dpr,dpr);
  initStars(); draw();
}

// ── BODY POSITIONS ─────────────────────────────
function getAcheaPos(){
  const b=BODIES.find(x=>x.id==='achea');
  return {x: auPx(b.sma*(1-b.ecc)), y:0};
}

function bodyPos(b){
  if(b.isStar)  return {x:0,y:0};
  if(b.isBelt)  return null;
  if(b.isMoon){
    const ap=getAcheaPos();
    const r=kmPx(b.moon_sma_km*(1-b.moon_ecc));
    const ang=b.id==='galise'?-Math.PI/2:Math.PI/3;
    return {x:ap.x+Math.cos(ang)*r, y:ap.y+Math.sin(ang)*r};
  }
  return {x:auPx(b.sma*(1-b.ecc)), y:0};
}

// ── SCREEN RADIUS ──────────────────────────────
const MIN_R=3; // minimum screen px

function bodyScreenR(b){
  if(!b.radius_km) return Math.max(MIN_R,10);
  return Math.max(MIN_R, kmPx(b.radius_km)*camScale);
}

// ── COLORS ─────────────────────────────────────
function rgba(r,g,b,a){return `rgba(${r},${g},${b},${a})`;}
function h2rgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function lighten(h,a){const[r,g,b]=h2rgb(h);return`rgb(${Math.min(255,r+a)},${Math.min(255,g+a)},${Math.min(255,b+a)})`;}
function darken(h,a) {const[r,g,b]=h2rgb(h);return`rgb(${Math.max(0,r-a)},${Math.max(0,g-a)},${Math.max(0,b-a)})`;}

// ── DRAW ───────────────────────────────────────
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#03050f'; ctx.fillRect(0,0,W,H);
  // Stars — fixed in screen space
  stars.forEach(s=>{
    ctx.globalAlpha=s.a; ctx.fillStyle='#c8daf5';
    ctx.beginPath(); ctx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=1;

  ctx.save();
  ctx.translate(W/2+camX*camScale, H/2+camY*camScale);
  ctx.scale(camScale,camScale);

  drawBelts();
  drawOrbits();
  drawBodies();

  ctx.restore();
}

function drawBelts(){
  BODIES.forEach(b=>{
    if(!b.isBelt) return;
    const inner=auPx(b.sma-b.width/2);
    const outer=auPx(b.sma+b.width/2);
    const[r,g,bl]=h2rgb(b.color);
    // Draw as filled annulus with gradient
    const grd=ctx.createRadialGradient(0,0,inner,0,0,outer);
    grd.addColorStop(0,   rgba(r,g,bl,0));
    grd.addColorStop(0.15,rgba(r,g,bl,0.18));
    grd.addColorStop(0.5, rgba(r,g,bl,0.35));
    grd.addColorStop(0.85,rgba(r,g,bl,0.18));
    grd.addColorStop(1,   rgba(r,g,bl,0));
    ctx.beginPath();
    ctx.arc(0,0,outer,0,Math.PI*2);
    ctx.arc(0,0,inner,0,Math.PI*2,true);
    ctx.fillStyle=grd; ctx.fill();
  });
}

function drawOrbits(){
  const ap=getAcheaPos();

  BODIES.forEach(b=>{
    if(b.isStar||b.isBelt) return;
    const isSel=selectedId===b.id, isHov=hoveredId===b.id;
    const[r,g,bl]=b.gc||h2rgb(b.color);
    const alpha=isSel?.85:isHov?.55:.22;
    const lw=(isSel?1.2:.65)/camScale;

    if(b.isMoon){
      // Circle around Achea in world coords
      const orbitR=kmPx(b.moon_sma_km);
      ctx.save();
      ctx.translate(ap.x,ap.y);
      ctx.beginPath(); ctx.arc(0,0,orbitR,0,Math.PI*2);
      ctx.strokeStyle=rgba(r,g,bl,alpha);
      ctx.lineWidth=lw;
      if(!isSel) ctx.setLineDash([3/camScale,5/camScale]);
      ctx.stroke(); ctx.setLineDash([]); ctx.restore();
    } else {
      // True Keplerian ellipse: a=sma, e=ecc, centre offset by -a*e from star
      const a=auPx(b.sma), e=b.ecc;
      const bv=a*Math.sqrt(1-e*e);
      const cx=-a*e;  // ellipse centre x in world (star at origin = right focus)
      ctx.save();
      ctx.translate(cx,0);
      ctx.beginPath(); ctx.ellipse(0,0,a,bv,0,0,Math.PI*2);
      ctx.strokeStyle=rgba(r,g,bl,alpha);
      ctx.lineWidth=lw;
      if(!isSel) ctx.setLineDash([4/camScale,7/camScale]);
      ctx.stroke(); ctx.setLineDash([]); ctx.restore();
    }
  });
}

function drawBodies(){
  BODIES.forEach(b=>{
    if(b.isBelt) return;
    const p=bodyPos(b);
    // Draw in world space (inside the camScale/translate save block)
    const wx=p.x, wy=p.y;
    // World-space radius
    const rw=b.radius_km ? kmPx(b.radius_km) : (b.isStar?20/camScale:6/camScale);
    const rActual=Math.max(rw, MIN_R/camScale);

    const isSel=selectedId===b.id, isHov=hoveredId===b.id;
    const[gr,gg,gb]=b.gc||h2rgb(b.color);

    // Glow
    if(b.isStar||isSel||isHov){
      const gr2=rActual*(b.isStar?8:4);
      const ga=b.isStar?.6:.45;
      const grd=ctx.createRadialGradient(wx,wy,0,wx,wy,gr2);
      grd.addColorStop(0,   rgba(gr,gg,gb,ga));
      grd.addColorStop(0.4, rgba(gr,gg,gb,ga*.3));
      grd.addColorStop(1,   rgba(gr,gg,gb,0));
      ctx.beginPath(); ctx.arc(wx,wy,gr2,0,Math.PI*2);
      ctx.fillStyle=grd; ctx.fill();
    }

    // Habitable indicator
    if(b.isHabitable&&(isSel||isHov)){
      ctx.beginPath(); ctx.arc(wx,wy,rActual*3,0,Math.PI*2);
      ctx.strokeStyle=rgba(74,240,216,.4); ctx.lineWidth=.8/camScale; ctx.stroke();
    }

    // Disk
    const grd=ctx.createRadialGradient(wx-rActual*.3,wy-rActual*.35,0,wx,wy,rActual);
    grd.addColorStop(0,   lighten(b.color,70));
    grd.addColorStop(0.45,b.color);
    grd.addColorStop(1,   darken(b.color,45));
    ctx.beginPath(); ctx.arc(wx,wy,rActual,0,Math.PI*2);
    ctx.fillStyle=grd; ctx.fill();

    // Rings
    if(b.hasRing) drawRing(wx,wy,rActual,b.ringTiltY,b.ringCol);

    // Selection ring
    if(isSel){
      ctx.beginPath(); ctx.arc(wx,wy,rActual+2.5/camScale,0,Math.PI*2);
      ctx.strokeStyle=rgba(gr,gg,gb,.9); ctx.lineWidth=1.2/camScale; ctx.stroke();
    }

    // Label
    const minSc=b.isStar?.005:b.isMoon?.5:.02;
    if(camScale>=minSc){
      const fs=(b.isStar?11:b.isMoon?9:9)/camScale;
      ctx.textAlign='center'; ctx.font=`${fs}px 'Share Tech Mono',monospace`;
      ctx.fillStyle=isSel?'#e8f4ff':isHov?'#aac8e8':rgba(140,175,220,.8);
      ctx.fillText(b.name, wx, wy+rActual+12/camScale);
    }
  });
}

function drawRing(wx,wy,rw,tiltY,colHex){
  const[r,g,b]=h2rgb(colHex);
  const inner=rw*1.45, outer=rw*2.6;
  ctx.save(); ctx.translate(wx,wy); ctx.scale(1,tiltY);
  const grd=ctx.createRadialGradient(0,0,inner,0,0,outer);
  grd.addColorStop(0,   rgba(r,g,b,0));
  grd.addColorStop(0.1, rgba(r,g,b,.55));
  grd.addColorStop(0.5, rgba(r,g,b,.7));
  grd.addColorStop(0.9, rgba(r,g,b,.35));
  grd.addColorStop(1,   rgba(r,g,b,0));
  ctx.beginPath(); ctx.arc(0,0,outer,0,Math.PI*2); ctx.arc(0,0,inner,0,Math.PI*2,true);
  ctx.fillStyle=grd; ctx.fill(); ctx.restore();
}

// ── HIT TESTING ────────────────────────────────
// Everything consistent: bodyPos() → w2s() for screen coords, bodyScreenR() for radius.
// Zoom-adaptive hit bonus: large when zoomed out, shrinks as you zoom in
// Keeps bodies selectable even when they're sub-pixel, without swamping at high zoom
function hitBonus(){
  // ~30px at camScale=0.01, ~14px at camScale=1, ~6px at camScale=100
  return Math.max(6, 14 / Math.sqrt(camScale));
}

// Distance from screen point (sx,sy) to the nearest point on an elliptical orbit
function orbitScreenDist(b, sx, sy){
  if(b.isMoon){
    const ap=getAcheaPos();
    const[cx,cy]=w2s(ap.x,ap.y);
    const orbitR=kmPx(b.moon_sma_km)*camScale;
    const d=Math.hypot(sx-cx,sy-cy);
    return Math.abs(d-orbitR);
  }
  // Planet: sample 120 points on the ellipse, return min distance
  const a=auPx(b.sma), e=b.ecc;
  const bv=a*Math.sqrt(1-e*e);
  const ecx=-a*e; // ellipse centre in world
  let minD=Infinity;
  const N=120;
  for(let i=0;i<N;i++){
    const th=(i/N)*Math.PI*2;
    const wx=ecx+a*Math.cos(th), wy=bv*Math.sin(th);
    const[px,py]=w2s(wx,wy);
    const d=Math.hypot(sx-px,sy-py);
    if(d<minD) minD=d;
  }
  return minD;
}

function bodyAtScreen(sx,sy){
  const bonus=hitBonus();

  // 1. Try body disks first (highest priority)
  for(let i=BODIES.length-1;i>=0;i--){
    const b=BODIES[i]; if(b.isBelt) continue;
    const p=bodyPos(b);
    const[bsx,bsy]=w2s(p.x,p.y);
    const sr=bodyScreenR(b);
    if(Math.hypot(sx-bsx,sy-bsy) < sr+bonus) return b.id;
  }

  // 2. Try orbit lines (thicker tolerance so they're easy to click)
  const orbitTol=Math.max(6, bonus*0.8);
  for(let i=BODIES.length-1;i>=0;i--){
    const b=BODIES[i];
    if(b.isBelt||b.isStar) continue;
    if(orbitScreenDist(b,sx,sy) < orbitTol) return b.id;
  }

  return null;
}

// ── PANEL ──────────────────────────────────────
function showPanel(id){
  const b=BODIES.find(x=>x.id===id);
  document.getElementById('eState').style.display='none';
  document.getElementById('pFilled').style.display='flex';
  const ph=document.getElementById('pH');
  ph.style.borderLeft=`3px solid ${b.color}`; ph.style.paddingLeft='15px';
  const pn=document.getElementById('pN'); pn.textContent=b.name; pn.style.color=b.color;
  document.getElementById('pA').textContent=b.altname||'';
  document.getElementById('pT').textContent=b.type||'';
  let html='';
  for(const[sec,rows] of Object.entries(b.data)){
    html+=`<div class="stitle">${sec}</div>`;
    for(const[lbl,val] of Object.entries(rows)){
      if(String(val).length>44)
        html+=`<div class="drow"><span class="dlabel">${lbl}</span></div><div class="dnote">${val}</div>`;
      else
        html+=`<div class="drow"><span class="dlabel">${lbl}</span><span class="dval">${val}</span></div>`;
    }
  }
  document.getElementById('pB').innerHTML=html;
  document.getElementById('pB').scrollTop=0;
}
function hidePanel(){
  document.getElementById('eState').style.display='flex';
  document.getElementById('pFilled').style.display='none';
}

// ── INPUT ──────────────────────────────────────
const tt=document.getElementById('tt');

canvas.addEventListener('mousedown',e=>{
  dragging=true; didDrag=false;
  dragStart={x:e.clientX,y:e.clientY}; camStart={x:camX,y:camY};
  canvas.classList.add('dragging');
});
window.addEventListener('mousemove',e=>{
  if(dragging){
    const dx=e.clientX-dragStart.x, dy=e.clientY-dragStart.y;
    if(Math.hypot(dx,dy)>3) didDrag=true;
    camX=camStart.x+dx/camScale; camY=camStart.y+dy/camScale; draw(); return;
  }
  const hit=bodyAtScreen(e.clientX,e.clientY);
  if(hit!==hoveredId){hoveredId=hit; draw();}
  if(hit){
    const b=BODIES.find(x=>x.id===hit);
    tt.style.display='block'; tt.style.left=(e.clientX+14)+'px'; tt.style.top=(e.clientY-10)+'px';
    tt.textContent=b.name+(b.altname?' · '+b.altname:'');
    canvas.style.cursor='pointer';
  } else { tt.style.display='none'; canvas.style.cursor=dragging?'grabbing':'grab'; }
});
window.addEventListener('mouseup',e=>{
  canvas.classList.remove('dragging');
  canvas.style.cursor=hoveredId?'pointer':'grab';
  if(!didDrag){
    const hit=bodyAtScreen(e.clientX,e.clientY);
    if(hit){ selectedId=(selectedId===hit)?null:hit; if(selectedId) showPanel(selectedId); else hidePanel(); }
    else { selectedId=null; hidePanel(); }
    draw();
  }
  dragging=false;
});
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  const factor=e.deltaY<0?1.18:.847;
  const[wx,wy]=s2w(e.clientX,e.clientY);
  camScale=Math.min(50000,Math.max(.001,camScale*factor));
  // keep world point under cursor fixed
  const[nsx,nsy]=w2s(wx,wy);
  camX+=(e.clientX-nsx)/camScale; camY+=(e.clientY-nsy)/camScale; draw();
},{passive:false});

let lastTD=0, lastTMW=null;
canvas.addEventListener('touchstart',e=>{
  if(e.touches.length===1){
    dragging=true; didDrag=false;
    dragStart={x:e.touches[0].clientX,y:e.touches[0].clientY}; camStart={x:camX,y:camY};
  } else if(e.touches.length===2){
    lastTD=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    lastTMW=s2w((e.touches[0].clientX+e.touches[1].clientX)/2,(e.touches[0].clientY+e.touches[1].clientY)/2);
  }
},{passive:true});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(e.touches.length===1&&dragging){
    const dx=e.touches[0].clientX-dragStart.x, dy=e.touches[0].clientY-dragStart.y;
    if(Math.hypot(dx,dy)>3) didDrag=true;
    camX=camStart.x+dx/camScale; camY=camStart.y+dy/camScale; draw();
  } else if(e.touches.length===2){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    const mx=(e.touches[0].clientX+e.touches[1].clientX)/2, my=(e.touches[0].clientY+e.touches[1].clientY)/2;
    camScale=Math.min(50000,Math.max(.001,camScale*(d/lastTD)));
    const[nsx,nsy]=w2s(lastTMW[0],lastTMW[1]);
    camX+=(mx-nsx)/camScale; camY+=(my-nsy)/camScale; lastTD=d; draw();
  }
},{passive:false});
canvas.addEventListener('touchend',e=>{
  if(e.touches.length===0){
    if(!didDrag&&e.changedTouches.length===1){
      const t=e.changedTouches[0];
      const hit=bodyAtScreen(t.clientX,t.clientY);
      if(hit){selectedId=hit; showPanel(hit); draw();}
    }
    dragging=false;
  }
});

document.getElementById('bZI').addEventListener('click',()=>{camScale=Math.min(50000,camScale*1.5);draw();});
document.getElementById('bZO').addEventListener('click',()=>{camScale=Math.max(.001,camScale/1.5);draw();});
document.getElementById('bReset').addEventListener('click',()=>{
  camScale=1; camX=0; camY=0; selectedId=null; hidePanel(); draw();
});
document.getElementById('bMoons').addEventListener('click',()=>{
  // Zoom so Galise orbit (385130 km) appears ~120 screen px
  const ap=getAcheaPos();
  const moonR_world=kmPx(385130);
  const targetScale=120/moonR_world;
  camScale=targetScale; camX=-ap.x; camY=-ap.y; draw();
});

window.addEventListener('resize',()=>{ctx.setTransform(1,0,0,1,0,0);resize();});
resize();
</script>
</body>
</html>
